name: 버그
description: 재현 가능한 결함을 기록합니다.
title: "[Bug] "
labels:
  - type:bug
  - priority:P1
body:
  - type: markdown
    attributes:
      value: |
        비밀번호, 토큰, 개인정보가 포함된 로그는 붙이지 마세요.
  - type: textarea
    id: summary
    attributes:
      label: 증상 요약
      description: 무엇이 잘못되는지 적습니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 최소 재현 절차와 입력값을 적습니다.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: OS, 브라우저, 버전, 커밋, 실행 모드 등 재현에 필요한 정보를 적습니다.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그·스크린샷
      description: 민감정보를 제거한 로그만 붙입니다.
      render: shell
