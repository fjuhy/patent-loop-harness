# Example private workbench config.
#
# You only need to override what differs from the bundled defaults — the harness
# deep-merges this file over the packaged default_config.toml, so any table or key
# you omit is inherited. A [field]-only or [runner]-only file is valid.

# Retarget the research field. scope_terms and labels are derived from the
# name/description when omitted.
[field]
name = "semiconductor packaging control software"
description = "Semiconductor package inspection/verification software tied to recipe activation, package trace verification, and process control gates."

# Pick a runner and pin a model. Live web search is mandatory and fail-closed
# (require_web_search defaults to true); `patent-loop doctor --runner-smoke` verifies it.
[runner]
type = "codex"
model = "gpt-5.5"

# Or plug in any agent CLI instead of codex/claude. Placeholders:
# {prompt_file} {output_path} {root} {stage} {prompt}
# [runner]
# type = "shell"
# [runner.shell]
# command = ["cursor-agent", "-p", "--workdir", "{root}"]
# prompt_mode = "stdin"            # stdin | arg | file
# web_search_evidence_pattern = "" # regex the CLI prints when it searched; "" skips the search gate

# Category-only mode: `patent-loop scout` fills the backlog with validated seeds,
# and auto_when_empty lets `patent-loop run` refill it by itself.
[scout]
count = 3
auto_when_empty = false

[quality]
min_grade_for_pass = "B+"
