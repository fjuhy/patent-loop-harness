[runner]
type = "codex"
enabled = true
timeout_seconds = 2400
model = ""
capacity_retry_seconds = 300
capacity_retry_max_attempts = 3
repair_attempts = 1
require_web_search = true
ignore_user_config = true
ephemeral = true
bypass_hook_trust = false
env_allowlist = [
  "PATH",
  "HOME",
  "USER",
  "LOGNAME",
  "SHELL",
  "TMPDIR",
  "LANG",
  "LC_ALL",
  "LC_CTYPE",
  "CODEX_HOME",
  "CLAUDE_CONFIG_DIR"
]

[runner.codex]
command = "codex"
web_search = true
sandbox = "workspace-write"
approval_policy = "never"
ignore_user_config = true
ephemeral = true
bypass_hook_trust = false

[runner.claude]
command = "claude"
web_search = true
output_format = "json"
query = "Execute the task described in stdin."
bare = false
no_session_persistence = true
permission_mode = "acceptEdits"
max_turns = 0
max_budget_usd = 0.0
auth_check = true
extra_args = []

# Generic adapter for any agent CLI (pi, cursor-agent, copilot, gemini, aider, ...).
# Placeholders in command/extra_args: {prompt_file} {output_path} {root} {stage} {prompt}
# prompt_mode: "stdin" (prompt piped in) | "arg" (prompt appended as last argv) | "file"
# (no stdin; the CLI reads {prompt_file}). If the CLI can search the web, set
# web_search_evidence_pattern to a regex its live-search output matches so the
# fail-closed search gate applies; leave it empty to opt the runner out of that gate.
[runner.shell]
command = []
extra_args = []
prompt_mode = "stdin"
web_search_evidence_pattern = ""

# Category-only operation: `patent-loop scout` (or `run --scout-when-empty`)
# asks the runner for `count` seeds in the target field and keeps only those that
# pass strict seed validation. auto_when_empty lets `run` refill the backlog itself.
[scout]
count = 3
auto_when_empty = false

[usage_guard]
enabled = false
applies_to_runner = ["codex", "claude"]
check_only_before_new_idea = true
max_weekly_used_percent = 70.0
fail_closed_on_unknown = false

[usage_guard.codex]
env_var = "CODEX_WEEKLY_USED_PERCENT"
state_path = "state/codex_usage.json"
session_glob = "~/.codex/sessions/**/*.jsonl"
codex_sessions_glob = "~/.codex/sessions/**/*.jsonl"
max_session_files = 120
weekly_window_minutes = 10080

[usage_guard.claude]
env_var = "CLAUDE_WEEKLY_USED_PERCENT"
state_path = "state/claude_usage.json"

[quality]
min_prior_art_search_queries = 8
min_closest_references = 8
# Allowance gate uses a preponderance standard (allow unless a prima facie rejection
# actually stands), not certainty. Inventive step (진보성) is the real gate; the other
# axes need only clear a hard B floor, so borderline-but-allowable claims pass.
min_grade_for_pass = "B+"
min_grade_inventive_step = "B+"
min_grade_any_axis = "B"
forbid_conditional_pass = false
min_visual_html_chars = 24000
min_visual_svg_count = 3
min_visual_section_count = 16
min_visual_table_count = 2
min_visual_review_chars = 2500
min_visual_review_section_chars = 80
min_visual_review_component_chars = 350
min_visual_review_component_rows = 2

[paths]
archive = ""
