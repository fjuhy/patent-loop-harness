[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-loop-harness"
version = "0.1.0"
description = "Reusable patent idea and drafting loop harness with field-parameterized prompts and pluggable LLM runners."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Patent Loop Harness Contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
patent-loop = "patent_loop_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patent_loop_harness = [
  "default_config.toml",
  "prompts/*.md",
]
